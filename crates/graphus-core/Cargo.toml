[package]
name = "graphus-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
description = "Shared vocabulary (IDs, value model, errors, capability traits, constants) for Graphus."

[features]
# Deterministic writer scheduling for DST (`rmp` #973, `src/sched.rs`): turns the engine's yield
# points — page-latch acquisition and release, thread spawn/exit, commit publication, snapshot
# acquisition, GC phases — into hand-offs of a single execution token driven by a seeded RNG, so the
# global interleaving of N real writer threads becomes a pure function of the seed.
#
# OFF by default and enabled by NO dependency declaration anywhere in the workspace: only
# `graphus-dst`'s own `det-sched` passthrough turns it on, and only for the targets that declare
# `required-features = ["det-sched"]`. That isolation is the point. Cargo unifies features per
# resolve, so a crate that merely *declared* this dependency would arm the hook in every build that
# transitively reaches `graphus-core` — which is every crate in the workspace.
#
# Deliberately a cargo feature rather than `debug_assertions` (the gate `src/latch.rs` chose). The
# latch tripwire wants to be armed across the whole test suite because it is a *correctness*
# tripwire that costs a thread-local increment. A scheduler hook is *hot-path instrumentation* — it
# sits on `with_page_fetched`, the single hottest read in the engine — and arming it in every
# `cargo test --workspace` would instrument the very paths the certification gates exist to certify,
# the argument `graphus-storage/Cargo.toml` already makes for `read-probe` and `bufpool-probe`.
det-sched = []

[dependencies]
# IANA time-zone resolution (src/timezone.rs). It lives in this crate — the one every layer can
# already reach — because the two ingress paths for a named zone MUST resolve it identically:
# the Cypher temporal constructors (`datetime({timezone: 'Europe/Stockholm'})`, `rmp` task #60)
# and the PackStream `DateTimeZoneId` decoder (structure `0x69`, `rmp` task #908), which receives
# a zone id with no numeric offset and has to localize the UTC instant. `graphus-bolt` cannot
# depend on `graphus-cypher`, so the resolver cannot live there.
#
# `jiff-tzdb` embeds the compiled TZif tables of *vanilla* tzdata as static, dependency-free data
# (no runtime filesystem access, so it behaves identically on Linux/macOS/Raspberry Pi OS across
# x86-64/arm64/aarch64), and `tz-rs` parses and queries them. Vanilla data matters for TCK
# faithfulness: the `tzdb` crate was evaluated and rejected because its data is built WITH the
# `backzone` file, which gives Europe/Stockholm its own pre-1879 history (+01:12:12) where the
# TCK pins the vanilla link to Europe/Berlin (+00:53:28, `Temporal2.feature` scenario [6]).
# Deliberately NOT `chrono-tz`: Graphus has its own temporal type system in this crate and must
# not pull in `chrono`.
jiff-tzdb = "0.1.6"
tz-rs = "0.7.3"

# `loom` (set by the buffer pool's model-check lane) and `tsan` (set by `scripts/tsan-soak.sh`) are
# known custom cfgs this crate reads in `src/sched.rs` to REFUSE the combination with `det-sched`:
# both of those lanes own the thread interleaving themselves, and the deterministic scheduler running
# underneath them would make their findings vacuous. Register them so `unexpected_cfgs` — and
# therefore `clippy -D warnings` — stays quiet without a build script, exactly as
# `graphus-bufpool/Cargo.toml` does for `loom`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)', 'cfg(tsan)'] }
