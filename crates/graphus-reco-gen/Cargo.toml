[package]
name = "graphus-reco-gen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
description = "Deterministic, seeded product-recommendation graph generator (configuration-model FRIEND multigraph + popularity-skewed PURCHASED edges) for the product-recommendation performance-evaluation example (dev-only leaf crate)."
# UNPUBLISHED dev/example leaf crate, in the same spirit as `graphus-social-gen`, `graphus-iot-gen`
# and `graphus-fraud-gen`: it exists only to support the `examples/product-recommendation`
# performance-evaluation demonstration and is depended upon by NOTHING in the production build. In
# particular, `graphus-server` MUST NOT depend on it, so it adds ZERO overhead to the shipped binary.
publish = false

[lib]
name = "graphus_reco_gen"
path = "src/lib.rs"

[dependencies]
# The generator is HERMETIC: it emits the graph as `neo4j-admin import`-flavoured CSV and its config /
# summary as serde values. serde pins match the rest of the workspace.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Example client tooling (the `reco_bench` concurrent read driver + the evidence emitter) ---------
# These are the CLIENT-side crates the wire driver reuses; NONE of them is the engine/server, so the
# generator + `reco_gen` stay light and this crate stays a leaf `graphus-server` never depends on.
# The shared value model packed/unpacked on the Bolt wire (the "one value model").
graphus-core = { path = "../graphus-core" }
# The transport-agnostic Bolt 5.x codec. `reco_bench` is a *client*: it reuses the symmetric wire
# codec (handshake, framing, message, packstream) exactly as `graphus-cli` does and only owns the
# socket I/O — no wire format is reinvented here.
graphus-bolt = { path = "../graphus-bolt" }
# The shared, schema-versioned evidence harness (`EvidenceReport` + `EvidenceCollector`) every example
# emits its CPU/RAM/storage/throughput evidence through. A dev-only leaf crate, never in the server.
graphus-examples-harness = { path = "../graphus-examples-harness" }

# --- Bolt-over-TCP + TLS attach transport (rmp #693) -------------------------------------------------
# The `reco_bench` / `reco_load` clients reach an ALREADY-RUNNING instance (local or remote, e.g.
# pi516) over Bolt-over-TCP with TLS. This is the SAME synchronous stack `graphus-cli` uses (rustls
# 0.23 + the default `aws_lc_rs` provider): both crates are already in the workspace lock (the CLI
# added them for rmp #688), so reusing them here adds NO new transitive dependency tree. The client is
# synchronous, so it uses rustls' blocking `ClientConnection` + `StreamOwned` over a `std::net::TcpStream`.
rustls = "0.23"
# The Mozilla trust anchors backing `bolt+s://` (verified) TLS. A single pure-data crate (its only
# dependency, `rustls-pki-types`, is already in the lock), so it adds no runtime/native code.
# `bolt+ssc://` (self-signed, the pi516 mode) does not consult these roots — it accepts any cert.
webpki-roots = "1"

# The deterministic generator binary: streams the generated recommendation-graph CSV file set + a
# summary for a profile. Usage:
#   cargo run -p graphus-reco-gen --bin reco_gen -- --profile fast --out-dir <dir>
[[bin]]
name = "reco_gen"
path = "src/bin/reco_gen.rs"

# The network bulk-import (Mode A) loader + schema DDL + correctness asserts. REST-only (raw HTTP/1.1
# over `std::net::TcpStream`): CREATE DATABASE -> streaming bulk upload -> START DATABASE -> CREATE
# INDEX -> shape + recommendation-query asserts. Usage:
#   cargo run -p graphus-reco-gen --bin reco_load -- --rest 127.0.0.1:PORT --db recodb --data-dir <dir>
[[bin]]
name = "reco_load"
path = "src/bin/reco_load.rs"

# The concurrent UDS-Bolt read driver: sweeps a concurrency ladder of many simultaneous connections
# issuing the recommendation read battery, samples the server's CPU/RSS/IO, and emits standardized
# evidence. Usage:
#   cargo run -p graphus-reco-gen --bin reco_bench -- --socket <s> --db recodb --server-pid <pid>
[[bin]]
name = "reco_bench"
path = "src/bin/reco_bench.rs"

# The evidence regression gate: compares a fresh `reco_bench` report against the committed baseline
# using ONLY stable STRUCTURAL metrics (realised node/relationship + per-label counts). Needs only the
# harness + serde. Usage: `cargo run -p graphus-reco-gen --bin reco_baseline_cmp -- <baseline> <cand>`
[[bin]]
name = "reco_baseline_cmp"
path = "src/bin/reco_baseline_cmp.rs"

[dev-dependencies]
# The offline high-throughput CSV bulk importer (FR-BK) — the PRODUCTION ingest path. Used ONLY by
# `tests/bulk_import_validity.rs`, which proves the generated CSV file set is a valid bulk-import
# artifact (it round-trips through `BulkImporter` into a fresh in-memory `RecordStore` with matching
# node/relationship counts). These are the real engine crates, pulled in as dev-deps only — the
# library itself never touches them, and `graphus-server` does not depend on this crate, so this stays
# acyclic and adds nothing to the shipped binary.
graphus-bulk = { path = "../graphus-bulk" }
graphus-storage = { path = "../graphus-storage" }
graphus-io = { path = "../graphus-io" }
graphus-wal = { path = "../graphus-wal" }
