[package]
name = "graphus-examples-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
description = "Shared evidence-collection harness for Graphus's demonstrative `examples/*` (dev-only leaf crate)."
# This is an UNPUBLISHED dev/measurement leaf crate, in the same spirit as `graphus-bench`: it exists
# only to support the `examples/*` E2E demonstrations and is depended upon by NOTHING in the
# production build. In particular, `graphus-server` MUST NOT depend on it, so the harness adds ZERO
# overhead to the server binary. Keep its dependency surface lean.
publish = false

[dependencies]
# JSON evidence reports use the same serde pins as the rest of the workspace.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CPU + memory metering (`rmp #246`). On Unix we read `getrusage(2)` (self CPU + peak RSS) and, for a
# monitored child server PID, `/proc/<pid>/{stat,statm}` on Linux with a `ps`/`sysctl` fallback on
# macOS. Pulled in the same way as `graphus-io`/`graphus-wal`. This is a dev-only leaf crate (never in
# `graphus-server`), so the `unsafe` FFI it enables is confined here and adds zero overhead to the
# shipped binary.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# A tiny CLI that drives the harness end to end and writes an evidence directory. The smoke example
# (`examples/smoke-evidence/run.sh`) invokes it to prove the scaffold produces real output, and it
# doubles as a copy-from template for the future examples (`rmp #27-#33`).
# Usage: `cargo run -p graphus-examples-harness --bin emit_evidence -- <evidence-dir>`.
[[bin]]
name = "emit_evidence"
path = "src/bin/emit_evidence.rs"

# A driver that meters a RUNNING `graphus-server` (by PID + store/WAL paths) and emits a standardized
# evidence report. The live `examples/*` (`rmp #249+`) invoke it to collect real CPU/RSS/storage
# evidence against the server they boot, instead of injecting figures like `emit_evidence` does.
# Usage: `cargo run -p graphus-examples-harness --bin measure_server -- --evidence-dir <dir> ...`.
[[bin]]
name = "measure_server"
path = "src/bin/measure_server.rs"

# Samples a LIVE server process (CPU + RSS) from outside it, so a Node/Python/bash driver can produce
# SERVER evidence rather than its own (`rmp #717`). `--snapshot` reads the pid's cumulative CPU
# counters once (bracket a phase with two to get that phase's EXACT server CPU — this is what makes a
# per-algorithm core-utilisation figure real); `--watch` samples RSS on a cadence and reports the peak
# DELTA over the baseline, which is how a server-side response buffering bug becomes visible.
# Usage: `cargo run -p graphus-examples-harness --bin proc_watch -- --pid <PID> --snapshot`.
[[bin]]
name = "proc_watch"
path = "src/bin/proc_watch.rs"
