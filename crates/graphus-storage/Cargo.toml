[package]
name = "graphus-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
description = "Record store with index-free adjacency, tokens and element-ID mapping for Graphus."

[features]
# Deterministic Simulation Testing seam (`04 §11`): exposes `RecordStore::device_mut`, letting a DST
# harness reach the live block device of a running store to arm a fault model (I/O error, bit-rot,
# torn write, ...) mid-workload. Forwards to `graphus-bufpool/dst`. OFF by default, so the production
# build never compiles the seam and the device stays encapsulated.
dst = ["graphus-bufpool/dst"]

# Cold-open contract enforcement for the consistency checker (`rmp` #426): when enabled,
# `check::assert_cold_open` / `verify_on_open` panic if the buffer pool has dirty resident pages,
# so a caller that runs the checksum sub-pass against a warm pool (where on-disk corruption of a
# resident page would be silently missed) fails fast. OFF by default: there are legitimate warm
# callers (bulk import asserting structural consistency before reopen), and the production startup
# path is always cold-open. Recovery/startup harnesses can opt in to fail-fast enforcement.
check-cold-assert = []

# The buffer pool's write-back durability timers (`rmp` #974), forwarded to `graphus-bufpool`. Only
# `benches/eviction_convoy.rs` needs them, and that bench declares it via `required-features`.
#
# This is a FEATURE rather than a dev-dependency on purpose. A dev-dependency with the feature
# enabled would be unified into every `cargo test`/`cargo bench` resolve for the workspace, so the
# whole certification gate would link a `graphus-bufpool` carrying two `Instant::now()` calls per
# cache-miss read and four more per write-back — instrumenting exactly the hot paths the gate exists
# to certify. Behind a feature, the default gate runs the production shape and the bench opts in.
bufpool-probe = ["graphus-bufpool/bufpool-probe"]

# Doublewrite staging timers plus the measurement-only A/B switch for where the staging barrier runs
# (`rmp` #993). Same reasoning as `bufpool-probe`: a feature, not a dev-dependency, so the default
# certification gate compiles the production shape — and so the barrier-position switch, which must
# never exist on a durability path in production, is absent from that build entirely.
dwb-probe = []

# Per-thread record-read counters on the property read path (`rmp` #967, acceptance criterion 2):
# `props.store` record reads and `undo.store` delta reads, counted at their sole decode sites. What
# they prove, why a count rather than a timing, and what they cost is documented in `src/read_probe.rs`.
#
# Same reasoning as `bufpool-probe`: a FEATURE, not a dev-dependency. A dev-dependency carrying the
# instrumentation would be unified into every `cargo test`/`cargo bench` resolve for the workspace, so
# the certification gate would link a counter bump into `read_view::read_prop` — the hottest read in
# the engine, and precisely the path #967's own benchmark must measure unperturbed. OFF by default:
# the production build and the default gate compile the read path with no instrumentation at all.
#
# The observation API (`read_probe::counting`, `read_probe::RecordReads`) is gated on this feature and
# is ABSENT without it, so a test that asserts a record-read count fails to compile rather than
# passing vacuously against a stubbed zero.
#   cargo test -p graphus-storage --features read-probe --test prop_visible_read_record_count
read-probe = []

[dependencies]
graphus-core = { path = "../graphus-core" }
graphus-io = { path = "../graphus-io" }
graphus-bufpool = { path = "../graphus-bufpool" }
# The prepend publication protocol shared by every chain head (`rmp` #1028). A leaf crate, so it can
# be model-checked under the global `--cfg loom` rustflag; see its `Cargo.toml`.
graphus-chainhead = { path = "../graphus-chainhead" }
# The freeze frontier's algebra — descend by `fetch_min`, raise by compare-exchange, and nothing else
# (`rmp` #1014). A leaf crate for the same reason as its siblings: so the three operations can be
# model-checked under the global `--cfg loom` rustflag. The field in `FixedStores` IS this type, so the
# model checks the production cell rather than a copy of it.
graphus-freezefloor = { path = "../graphus-freezefloor" }
# The live, append-only, lock-free device-page map every fixed-record store's location oracle is built
# on (`rmp` #721). A LEAF crate (graphus-core only), which is what lets it be `loom` model-checked in
# isolation — see its Cargo.toml. Acyclic: it never depends on storage.
graphus-pagemap = { path = "../graphus-pagemap" }
# The group-staging barrier for the doublewrite (`rmp` #994). A LEAF crate so its leader/follower
# protocol can be `loom`-model-checked in isolation — see its Cargo.toml.
graphus-groupsync = { path = "../graphus-groupsync" }
graphus-wal = { path = "../graphus-wal" }
# The consistency checker (src/check.rs) verifies store/index agreement, so it needs the index
# types. This edge is acyclic: graphus-index depends on core/io/bufpool/wal, never on storage.
graphus-index = { path = "../graphus-index" }
# The Active/Recent Transaction Table (`CommitRegistry`) the record store owns for lazy GC-time
# header freezing (`rmp` task #49). Acyclic: graphus-txn depends only on graphus-core, never on
# storage.
graphus-txn = { path = "../graphus-txn" }
# CRC32C for the whole-payload backup digest (src/backup.rs); same crate/version the page header
# already uses in graphus-bufpool, so no new transitive dependency enters the workspace.
crc32c = "0.6"
# Inline-capacity buffer for the tiny WAL redo/undo patches built on the OLTP write path
# (`paging::Patch`, `rmp` #373): a node/rel/prop field or whole-record patch (<=128 bytes) is
# encoded with zero heap allocation. Same crate/version already resolved in the workspace tree.
smallvec = "1"

[dev-dependencies]
graphus-sim = { path = "../graphus-sim" }
# Property-based round-trip invariants for the value/property codecs (`tests/proptest_codecs.rs`,
# `rmp` task #27). `default-features = false` + only `std` keeps the test-time dependency tree
# minimal (no fork/timeout/tempfile), matching the pin already used by `graphus-bolt`.
proptest = { version = "1", default-features = false, features = ["std"] }

# `loom` model-checks concurrent orderings exhaustively over every legal interleaving. The pin and
# the convention are the same as `graphus-txn`'s: a `loom` model lives in its own test crate, gated on
# `--cfg loom`, so it never enters a normal build.
#   RUSTFLAGS="--cfg loom" cargo test -p graphus-storage --test <model> --release
#
# NOTE: this crate currently has **no** `--cfg loom` test. The one that justified this entry model-
# checked the `rmp` #808 `LabelHistory` lock-free pre-filter, and it went with that mechanism when
# `rmp` #968 moved label versions onto the undo chain. The pin is kept, registered against
# `unexpected_cfgs` below, for the next model this crate needs.
[target.'cfg(loom)'.dev-dependencies]
loom = "0.7.2"

# `loom` is a known custom cfg the crate sets via RUSTFLAGS; register it so `unexpected_cfgs` does
# not warn when the flag is absent from a normal build.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

# The eviction write-back convoy harness (`rmp` #974): a real-file, real-WAL, real-doublewrite
# measurement of concurrent read throughput with a working set that exceeds the buffer pool. Not a
# Criterion bench (it drives its own threads and reports a table), so the default harness is off.
# It reads the pool's write-back timers, hence `required-features` — which also keeps that
# instrumentation out of the default test gate.
#   cargo bench -p graphus-storage --bench eviction_convoy --features bufpool-probe,dwb-probe
[[bench]]
name = "eviction_convoy"
harness = false
required-features = ["bufpool-probe", "dwb-probe"]
