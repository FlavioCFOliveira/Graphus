[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.10"
edition = "2024"
rust-version = "1.85"
license-file = "LICENSE"
repository = "https://github.com/FlavioCFOliveira/Graphus"
authors = ["Flavio CF Oliveira"]

# Profiling instrumentation, pinned once here so every crate that opts in measures with the same
# version (see CLAUDE.md, "Empirical measurement", and `docs/profiling.md` for how to run each tool).
#
# Both are declared `optional` at every use site and sit behind a feature that is OFF by default,
# because both are *invasive by construction*: `dhat` replaces the global allocator and
# `tracing-tracy` opens a listening socket and streams every span off-process. Neither may enter a
# production build by accident, and neither is compiled at all unless its feature is named.
#
# The other tools in the "Empirical measurement" policy — cargo-flamegraph, samply, perf, heaptrack —
# are EXTERNAL BINARIES, not crates: they observe an unmodified build from outside the process and so
# have nothing to declare here. What they do need is symbols, which is what `profile.profiling` below
# exists to give them.
#
# Licences checked before adoption (CLAUDE.md, "Direct copying is forbidden"): dhat is
# `MIT OR Apache-2.0`, tracing-tracy is `MIT/Apache-2.0`. Both are permissive and compatible.
# tracing-tracy's MSRV (1.70) sits below this workspace's 1.85, so it constrains nothing.
[workspace.dependencies]
# Heap profiler (the dhat-rs port of Valgrind's DHAT): records every allocation with its full call
# stack and writes `dhat-heap.json`, readable at https://nnethercote.github.io/dh_view/dh_view.html.
# It answers *where* the heap goes and how many times — not how long the CPU spent there.
dhat = "0.3"
# Streams `tracing` spans to the Tracy real-time profiler as a `tracing-subscriber` layer, giving a
# millisecond-by-millisecond view of thread execution. It needs the Tracy GUI (a separate program) to
# connect to the running process, hence the `registry` feature it pulls in at the use site.
tracing-tracy = "0.11"

# Release build configuration (revisit with measurements — see
# specification/04-technical-design.md and the Rust Performance Book).
[profile.release]
codegen-units = 1
lto = "thin"

# The profile the verification gates run under (`rmp` #1043).
#
# WHY IT EXISTS. Measured on this workspace (16 cores, 30 GB, rustc 1.96.0), running all 452 test
# binaries and 6347 tests one at a time, exactly as `cargo test` does:
#
#   profile.dev  (opt-level = 0)   2139,7 s   —   35,7 min
#   profile.gate (opt-level = 1)    333,3 s   —    5,6 min   (6,4x)
#
# The cost was never compilation: with the cache warm, `cargo test --workspace --no-run` returns in
# 0,58 s. It was executing unoptimised code, and it concentrated — 78% of the time sat in 20 of the
# 452 binaries, while 248 of them cost under 0,1 s each.
#
# WHY opt-level = 1 AND NOT 2. Measured both. `opt-level = 2` runs marginally faster (310,2 s) and
# costs nearly twice as much to build: 723,9 s against 408,7 s from cold, and 608,7 s against 356,0 s
# to rebuild after touching `graphus-storage`. Since the gates rebuild on every change, the cycle that
# matters — rebuild plus run — is 690,8 s at level 1 against 918,9 s at level 2. Level 1 wins the
# thing being optimised.
#
# WHY NOT `--release`, WHICH WOULD BE FASTER STILL. Because it turns `debug_assertions` and
# `overflow-checks` OFF: the suite would run faster and prove less, with nothing in the output saying
# so. Both are therefore set EXPLICITLY here rather than inherited, and
# `graphus-core/tests/verification_profile_keeps_its_assertions.rs` proves from inside the compiled
# binary that they survived — it passes under this profile and FAILS under `--release`, on purpose.
#
# `debug = "line-tables-only"` keeps file:line in every backtrace (a gate that cannot be diagnosed is
# worth little) while dropping the variable-level debuginfo that made a single test binary 126 MB;
# they are 10,5 MB here, which took the whole target directory from 449 GB to ~20 GB.
#
# NOT ADOPTED, and measured rather than assumed: the `lld` linker shipped with the toolchain. It links
# one binary in 3,0 s against 25,8 s, and changes the gate's rebuild cycle not at all (355,3 s against
# 356,0 s) — the dominant cost is codegen, not linking. It buys an environment dependency and no time.
[profile.gate]
inherits = "dev"
opt-level = 1
debug = "line-tables-only"
debug-assertions = true
overflow-checks = true
incremental = false

# The profile the sampling profilers run under (CLAUDE.md, "Empirical measurement").
#
# WHY IT EXISTS. cargo-flamegraph, samply and perf attribute samples through the binary's debug
# information. Measured on this workspace (`readelf -S`, `nm -C`): the release binary carries the
# same 4897 Graphus symbols in `.symtab` but ZERO debug sections, so a release profile resolves
# function NAMES and nothing else — no file:line, and every frame `lto`/`codegen-units = 1` inlined
# is silently folded into its caller, which is exactly where this engine's hot paths live. `--dev`
# has the debug info but measures unoptimised code, profiling a program nobody ships. This profile is
# the only combination that answers the question actually being asked: the SAME code generation as
# release, plus the debug information needed to attribute it (84 MB against release's 20 MB).
#
# It INHERITS FROM RELEASE DELIBERATELY, `codegen-units = 1` and `lto = "thin"` included. Loosening
# either would make the profile faster to build and its measurements a fiction — inlining decisions
# are precisely what determines where a release build spends its time, so a profile that changes them
# reports someone else's program. Frames inlined away are not lost: `debug = "line-tables-only"`
# keeps the inline records, so the profilers still unwind through them.
#
# `debug = "line-tables-only"` and not `debug = true`: line tables are what the sampling profilers
# consume (function, file, line), while full variable-level debuginfo is for debuggers and cost this
# workspace a measured 126 MB in a single binary (see `profile.gate` above). `strip` is left off
# explicitly because `strip = "debuginfo"` would silently discard exactly what this profile is for.
#
#   cargo build --profile profiling -p graphus-server
#   samply record ./target/profiling/graphus-server config.toml
#
# `perf` on a kernel without frame pointers needs `--call-graph dwarf`, or rebuild with
# `RUSTFLAGS="-C force-frame-pointers=yes"`; see `docs/profiling.md`.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"
