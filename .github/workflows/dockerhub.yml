name: Docker Hub

# Build and publish the multi-architecture Graphus container image (linux/amd64 + linux/arm64) to
# Docker Hub.
#
# CROSS-COMPILED on a native x86_64 self-hosted runner: the Dockerfile builder is pinned to
# `--platform=$BUILDPLATFORM`, so the heavy Rust compile runs natively on x86 and cross-compiles the
# arm64 (Raspberry Pi 5 / Apple Silicon) binary — no emulated compile. QEMU is set up only for the
# tiny arm64 runtime layers. The trigger below is trusted (never a fork pull request), so running on
# the self-hosted machine is safe. This workflow only BUILDS the image; it never runs the tests.
#
#   * workflow_dispatch    → manual, on-demand publish of a specific version (required input).
#
# This is the SOLE trigger: the image is NEVER built or published in reaction to a push, a commit,
# or a GitHub Release — publishing to Docker Hub is always an explicit, on-demand action.
#
# The image is published with CONFORMANT tags ONLY — `:latest` plus a `:vX.Y.Z` version tag.
#
# Required repository secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub access token).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.0.6 (semver, no leading 'v'). Publishes :vX.Y.Z and :latest."
        required: true
        type: string

# Never cancel an in-flight publish — a half-pushed multi-arch manifest is worse than waiting.
concurrency:
  group: dockerhub-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_REPO: graphus
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  publish:
    name: Build and publish to Docker Hub
    # Cross-compile on the `wg1` native x86_64 self-hosted runner (both triggers are trusted — no fork PRs).
    runs-on: [self-hosted, Linux, X64, wg1]
    steps:
      # A dispatch must name a concrete semver version up front, so Docker Hub can never receive a
      # non-conformant (sha/branch) tag via the manual path.
      - name: Validate the dispatch version is semver
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if printf '%s' "$VERSION" | LC_ALL=C grep -q '[[:cntrl:]]'; then
            echo "::error::The 'version' input must not contain control characters or newlines."
            exit 1
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::The 'version' input must be semver like 0.0.6 (no leading v); got '$VERSION'."
            exit 1
          fi
          echo "Publishing version v$VERSION."

      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify Docker Hub credentials are configured
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::The DOCKERHUB_USERNAME and/or DOCKERHUB_TOKEN repository secrets are not set. Configure them under Settings -> Secrets and variables -> Actions before running this workflow."
            exit 1
          fi
          echo "Docker Hub credentials are present."

      # QEMU is needed only for the arm64 runtime layers; the Rust compile is cross-compiled on x86.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_REPO }}
          # CONFORMANT TAGS ONLY — every publish carries :vX.Y.Z + :latest, never a sha or branch tag.
          # The version comes from the required `version` dispatch input (the only trigger).
          tags: |
            type=raw,value=v${{ inputs.version }}
            type=raw,value=latest

      - name: Build and push (multi-arch, cross-compiled)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish summary
        run: |
          {
            echo "### Published to Docker Hub (cross-compiled multi-arch)"
            echo ""
            echo "**Digest:** \`${{ steps.build.outputs.digest }}\`"
            echo ""
            echo "**Tags:**"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
