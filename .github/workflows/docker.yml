name: docker

# Build (and, except on pull requests, publish) the multi-architecture Graphus
# container image — linux/amd64 + linux/arm64 — to the GitHub Container Registry.
#
#   * Pull requests                   → build only (no push), linux/amd64 only. The
#     native amd64 build is fast and catches Dockerfile breakage; the arm64 image code
#     is already exercised natively by the aarch64 leg of the CI workflow.
#   * Pushes to main                  → build + push the full multi-arch manifest as the
#     rolling `:main` tag (a dev image; the release image is handled by dockerhub.yml).
#   * Tags `v*` or manual dispatch    → build + push a full multi-arch manifest
#     (`:vX.Y.Z`, `:X.Y`, and `:latest` for tags).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker/**"
      - "docker-compose.yml"
      - ".github/workflows/docker.yml"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  # Only cancel superseded pull-request builds (they never push). A run on main, a tag, or a
  # dispatch publishes a multi-arch manifest, and a half-pushed manifest is worse than waiting —
  # matching the deliberate cancel-in-progress: false in dockerhub.yml — so those are never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # QEMU lets the runner build the non-native (arm64) image under emulation.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Only publish for tags or manual dispatch; PRs build without pushing.
      - name: Decide whether to push
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: steps.gate.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          # PRs build the native amd64 image only (fast); pushes/tags build the full multi-arch
          # manifest so arm64 is validated before it can ship.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || env.PLATFORMS }}
          push: ${{ steps.gate.outputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
